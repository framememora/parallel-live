plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.watermarkcompositorandroid'
version = '0.1.0'

android {
  namespace "expo.modules.watermarkcompositorandroid"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

// NOTE(verify-on-device): pin to the media3 version resolved in the app's
// dependency tree at build time; bump here if Gradle reports a conflict.
def media3_version = "1.5.1"

dependencies {
  implementation "androidx.media3:media3-transformer:$media3_version"
  implementation "androidx.media3:media3-effect:$media3_version"
  implementation "androidx.media3:media3-common:$media3_version"
}
